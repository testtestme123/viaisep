<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIAISEP - 图形选择助手（简洁模式）</title>
    
    <!-- 引入简洁模式样式 -->
    <link rel="stylesheet" href="selection-assistant-compact.css">
    
    <style>
        /* 页面基本布局 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f9fafb;
        }
        
        /* 画布区域 */
        .canvas-container {
            display: flex;
            height: 100%;
        }
        
        .canvas {
            flex: 1;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            position: relative;
            overflow: hidden;
            cursor: default;
        }
        
        .canvas-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0; bottom: 0;
        }
        
        /* 节点样式 */
        .canvas-node {
            position: absolute;
            padding: 8px 12px;
            background: white;
            border: 1px solid #9ca3af;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            min-width: 100px;
        }
        
        .canvas-node:hover {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .canvas-node.selected {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        
        .node-label {
            font-size: 0.85rem;
            color: #1f2937;
            font-weight: 500;
        }
        
        /* 边（关系）样式 */
        .canvas-edge {
            position: absolute;
            padding: 4px 8px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #4b5563;
        }
        
        .canvas-edge.selected {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        
        /* 侧边栏（精简版） */
        .simplified-sidebar {
            width: 280px;
            padding: 12px;
            background: white;
            border-left: 1px solid #e5e7eb;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .sidebar-header {
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .selected-count-badge {
            font-weight: 700;
            color: #3b82f6;
            background: #eff6ff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        /* 紧凑元素列表 */
        .compact-element-list {
            max-height: 150px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 12px;
            overflow-y: auto;
            background: #fafafa;
            font-size: 0.85rem;
        }
        
        .compact-element-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            color: #374151;
            background: white;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        
        .compact-element-item:hover {
            background: #f9fafb;
            border-color: #e5e7eb;
        }
        
        .compact-element-icon {
            font-size: 1.1rem;
            margin-right: 8px;
            min-width: 1.2em;
            text-align: center;
        }
        
        .compact-element-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: default;
        }
        
        /* 描述输入区 */
        .description-input-area {
            margin-bottom: 12px;
        }
        
        .description-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }
        
        .compact-textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            font-size: 0.85rem;
            line-height: 1.5;
            background: white;
            color: #1f2937;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .compact-textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .compact-textarea::placeholder {
            color: #9ca3af;
        }
        
        /* 操作按钮条 */
        .compact-action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .action-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .action-btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        
        .action-btn-secondary:hover:not(:disabled) {
            background: #e5e7eb;
        }
        
        .action-btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .action-btn-primary:hover:not(:disabled) {
            background: #2563eb;
        }
        
        .action-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 状态栏 */
        .compact-status-bar {
            border-top: 1px solid #f3f4f6;
            padding-top: 8px;
        }
        
        .status-indicator {
            color: #3b82f6;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            padding: 6px 0;
            display: none;
        }
        
        .status-message {
            font-size: 0.85rem;
            text-align: center;
            padding: 6px;
            border-radius: 4px;
            display: none;
            margin-top: 4px;
        }
        
        .status-message.success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-message.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .status-progress-bar {
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            margin-top: 6px;
            display: none;
            border-radius: 2px;
        }
        
        /* 空状态消息 */
        .empty-state-message {
            text-align: center;
            color: #9ca3af;
            font-size: 0.85rem;
            padding: 16px 8px;
            line-height: 1.4;
        }
        
        /* 欢迎提示 */
        .welcome-tip {
            background: #fef3c7;
            border: 1px solid #fde68a;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: #92400e;
        }
        
        .welcome-tip strong {
            color: #78350f;
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <!-- 画布区域 -->
        <div id="canvas" class="canvas">
            <div class="canvas-background"></div>
            <!-- 动态生成的节点和边将在这里 -->
            
            <!-- 示例节点（实际应用中由后端渲染） -->
            <div class="canvas-node" data-id="node-1" data-node-type="Module" 
                 data-description="用户管理模块" data-status="active"
                 x="100" y="100">
                <span class="node-label">用户管理</span>
            </div>
            
            <div class="canvas-node" data-id="node-2" data-node-type="Module"
                 data-description="订单处理模块" data-status="active"
                 x="300" y="100">
                <span class="node-label">订单处理</span>
            </div>
            
            <div class="canvas-edge" data-id="edge-1" data-source="node-1"
                 data-target="node-2" data-relation-type="calls"
                 x="200" y="100">
                <span class="edge-label">调用</span>
            </div>
        </div>
        
        <!-- 精简侧边栏 -->
        <aside id="sidebar" class="simplified-sidebar">
            <div class="sidebar-header">
                <span>选择助手</span>
                <span class="selected-count-badge">0</span>
            </div>
            
            <!-- 欢迎提示 -->
            <div class="welcome-tip">
                💡 <strong>工作流提示：</strong><br>
                1. 单击画布上的元素<br>
                2. Shift+单击多选<br>
                3. 在下方输入修改要求<br>
                4. 点击提交请求
            </div>
            
            <!-- 元素列表 -->
            <div class="compact-element-list">
                <div class="empty-state-message">
                    请在画布上选择要修改的元素
                </div>
            </div>
            
            <!-- 描述输入区 -->
            <div class="description-input-area">
                <label for="description-textarea" class="description-label">
                    修改请求描述
                </label>
                <textarea 
                    id="description-textarea" 
                    class="compact-textarea"
                    placeholder="请选择要进行的修改操作..."></textarea>
            </div>
            
            <!-- 操作按钮 -->
            <div class="compact-action-bar">
                <button class="action-btn action-btn-secondary btn-cancel">
                    ❌ 取消
                </button>
                <button class="action-btn action-btn-primary submit-btn" id="submit-btn" disabled>
                    ➤ 提交
                </button>
            </div>
            
            <button class="action-btn action-btn-secondary btn-clear" style="width: 100%; margin-top: 8px;">
                🗑️ 清空选择
            </button>
            
            <!-- 状态栏 -->
            <div class="compact-status-bar">
                <div class="status-indicator" id="status-indicator">
                    正在处理...
                </div>
                <div class="status-message" id="status-message"></div>
                <div class="status-progress-bar" id="status-progress-bar"></div>
            </div>
        </aside>
    </div>
    
    <!-- 引入 Selection Assistant -->
    <script src="selection-assistant.js"></script>
    
    <script>
        // 页面加载后初始化
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const assistant = new SelectionAssistant();
                assistant.init();
                console.log('Selection Assistant (简洁模式) 初始化成功');
            } catch (error) {
                console.error('Selection Assistant 初始化失败:', error);
            }
        });
        
        // 可选：在窗口关闭前清理资源
        window.addEventListener('beforeunload', () => {
            if (window.assistantInstance) {
                window.assistantInstance.destroy();
            }
        });
    </script>
</body>
</html>
